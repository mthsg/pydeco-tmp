[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydeco-tmp"
version = "0.2.0"
description = "Control TP-Link Deco routers locally over their native TMP protocol, without the app"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mthsg" }]
keywords = ["tp-link", "deco", "router", "tmp", "home-automation", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = ["paramiko>=3.0"]

[project.urls]
Homepage = "https://github.com/mthsg/pydeco-tmp"
Issues = "https://github.com/mthsg/pydeco-tmp/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/pydeco"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# PYI034 demande typing.Self (Python 3.11+) ; le projet supporte Python 3.9.
ignore = ["PYI034"]
